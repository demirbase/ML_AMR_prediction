project:
  name: "AMR_Genomic_Project"
  target_antibiotic: "ciprofloxacin"

paths:
  # Relative to project root
  data_dir: "data"
  raw_genomes_dir: "data/raw_genomes"
  kmc_outputs_dir: "data/kmc_outputs"
  matrix_dir: "data/matrix"
  metadata_file: "data/metadata/genome_amr_matrix.csv"
  logs_dir: "logs"
  models_dir: "models"
  results_dir: "results"
  figures_dir: "results/figures"
  tables_dir: "results/tables"

preprocessing:
  min_support: 10
  kmc_mem: 64
  threads: 8
  chunk_size: 200
  # System specific paths (can be absolute or relative to home using ~)
  kmc_bin: "~/bin/kmc"
  kmc_tools_bin: "~/bin/kmc_tools"

training:
  random_seed: 42
  n_trials: 30
  test_chunks: 4
  optuna_subset_count: 2
  file_prefix: "cipro"

xgboost_params:
  objective: "binary:logistic"
  eval_metric: "auc"
  booster: "gbtree"
  tree_method: "hist"
  device: "cpu"
  verbosity: 0
  n_jobs: 8

# Best parameters found from optimization
best_params:
  learning_rate: 0.07490720801688996
  max_depth: 5
  subsample: 0.6304847821154027
  colsample_bytree: 0.853026007512347
  min_child_weight: 8
  gamma: 2.397566540203559
  scale_pos_weight: 8.518110770078284
  n_estimators: 301
  objective: 'binary:logistic'
  eval_metric: 'auc'
  tree_method: 'hist'
  device: 'cpu'
  n_jobs: 8
  verbosity: 1

analysis:
  top_n_features: 50
